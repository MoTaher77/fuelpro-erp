<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="شعار محطة التميز">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d98b"/><stop offset=".45" stop-color="#d4a73c"/><stop offset="1" stop-color="#9c7020"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#127a5a"/><stop offset="1" stop-color="#063d2e"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8e1"/><stop offset=".5" stop-color="#f3d98b"/><stop offset="1" stop-color="#c8962e"/>
    </linearGradient>
  </defs>
  <!-- eight-point star badge: excellence -->
  <g transform="translate(120 120)">
    <rect x="-96" y="-96" width="192" height="192" rx="26" fill="url(#gold)"/>
    <rect x="-96" y="-96" width="192" height="192" rx="26" fill="url(#gold)" transform="rotate(45)"/>
    <rect x="-86" y="-86" width="172" height="172" rx="22" fill="url(#emerald)"/>
    <rect x="-86" y="-86" width="172" height="172" rx="22" fill="url(#emerald)" transform="rotate(45)"/>
    <circle r="78" fill="none" stroke="url(#gold)" stroke-width="3" opacity=".9"/>
    <circle r="70" fill="none" stroke="#f3d98b" stroke-width="1" opacity=".35" stroke-dasharray="2 5"/>
  </g>
  <!-- fuel drop -->
  <path d="M120 52 C120 52 78 104 78 134 a42 42 0 0 0 84 0 C162 104 120 52 120 52 Z" fill="url(#drop)" stroke="#8a611a" stroke-width="2"/>
  <!-- emerald flame inside the drop -->
  <path d="M121 102 c4 14 20 22 20 40 a21 21 0 0 1 -42 0 c0 -10 6 -16 10 -22 c1 8 4 12 8 13 c-2 -12 0 -22 4 -31 z" fill="url(#emerald)"/>
  <path d="M121 132 c3 6 9 10 9 17 a9 9 0 0 1 -18 0 c0 -6 5 -10 9 -17 z" fill="#f3d98b"/>
  <!-- highlight -->
  <path d="M104 98 q-10 16 -12 30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  <!-- small star at the top -->
  <path d="M120 22 l4.2 9 9.8 1.2-7.2 6.8 1.9 9.7-8.7-4.8-8.7 4.8 1.9-9.7-7.2-6.8 9.8-1.2z" fill="#fff4cf" stroke="#9c7020" stroke-width="1.2"/>
</svg>
