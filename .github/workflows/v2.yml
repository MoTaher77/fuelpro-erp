name: v2
# FuelPro v2 (docs/ARCHITECTURE-V2.md): the TypeScript core on SQLite and PostgreSQL, and the parity check
# against v1 (src/) — the same scenario must give identical books, to the minor unit, on every engine.
on:
  push:
    branches: [main]
    paths: ['v2/**', 'src/**', '.github/workflows/v2.yml']
  pull_request:
    paths: ['v2/**', 'src/**', '.github/workflows/v2.yml']
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: fuelpro, POSTGRES_PASSWORD: fuelpro-test, POSTGRES_DB: fp }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fuelpro" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      V2_PG_URL: postgres://fuelpro:fuelpro-test@127.0.0.1:5432/fp
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Tests (SQLite + PostgreSQL + parity with v1)
        run: node --version && npm test
  ui:
    # the shared screen in Chromium: server edition (SQLite and PostgreSQL) and the local-edition path (core in the page)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: fuelpro, POSTGRES_PASSWORD: fuelpro-test, POSTGRES_DB: fp }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fuelpro" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npx playwright install --with-deps chromium     # root: Playwright + sql.js (pinned)
      - run: npm ci && node tools/build.ts
        working-directory: v2
      - run: mkdir -p shots && node tests/e2e-ui.ts shots && node tests/e2e-ui.ts shots postgres://fuelpro:fuelpro-test@127.0.0.1:5432/fp && node tests/e2e-local.ts shots
        working-directory: v2
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: v2-screens, path: v2/shots, retention-days: 14 }
  desktop:
    # Tauri 2 installers (unsigned test builds): Windows .exe/.msi and Linux .deb
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: v2/apps/desktop/src-tauri }
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci && node tools/build.ts desktop
        working-directory: v2
      - run: npx tauri build --bundles ${{ runner.os == 'Windows' && 'nsis,msi' || 'deb' }}
        working-directory: v2/apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: fuelpro-desktop-${{ runner.os }}
          path: |
            v2/apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            v2/apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            v2/apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30
  android:
    # Capacitor Android debug APK (installable for testing; a signed release needs the owner's key)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - run: npm ci && node tools/build.ts mobile
        working-directory: v2
      - name: Android project (generated, not kept in Git)
        working-directory: v2/apps/mobile
        run: |
          npx cap add android
          cp -r resources/android-res/. android/app/src/main/res/
          npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: v2/apps/mobile/android
      - uses: actions/upload-artifact@v4
        with: { name: fuelpro-android-debug-apk, path: v2/apps/mobile/android/app/build/outputs/apk/debug/*.apk, retention-days: 30 }
