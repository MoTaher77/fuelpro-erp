name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:   # a real PostgreSQL for the Phase 2 bridge tests (UTF-8, like production)
        image: postgres:16
        env: { POSTGRES_USER: fuelpro, POSTGRES_PASSWORD: fuelpro-test, POSTGRES_DB: fp }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fuelpro" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FUELPRO_TEST_PG: postgres://fuelpro:fuelpro-test@127.0.0.1:5432/fp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Type check (files marked // @ts-check)
        run: npm run typecheck
      - name: Dependency audit (runtime dependencies, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - run: node --version && npm test
  e2e:
    # the real UI in Chromium on a freshly seeded demo database (never real data)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  perf:
    # repeatable speed report on a demo database (docs/PERFORMANCE.md); informative, the numbers depend on the runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Seed a 365-day demo database and measure the API and the screens
        run: |
          export PW="ci-$(node -e "console.log(require('crypto').randomBytes(12).toString('hex'))")"
          DB_PATH=/tmp/bench.db DEMO_PASSWORD="$PW" node --disable-warning=ExperimentalWarning scripts/seed-demo.js --days 365 > /dev/null
          node --disable-warning=ExperimentalWarning scripts/bench-api.js --db /tmp/bench.db --email demo@fuelpro.demo --password "$PW" --runs 20 --json perf-api.json | tee perf-api.txt
          node --disable-warning=ExperimentalWarning scripts/bench-pages.js --db /tmp/bench.db --email demo@fuelpro.demo --password "$PW" --repeat 1 --json perf-pages.json | tee perf-pages.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fuelpro-perf
          path: perf-*
          retention-days: 30
  artifact:
    # FuelPro Artifact edition (ADR-20): the same src/ on sql.js, the engine the claude.ai page uses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Whole suite on sql.js, file backups excluded (the page has no file system)
        run: npm run test:artifact
      - name: Build the Artifact bundle
        run: |
          DEMO_PASSWORD="ci-$(node -e "console.log(require('crypto').randomBytes(12).toString('hex'))")" npm run build:artifact -- --days 90
      - uses: actions/upload-artifact@v4
        with:
          name: fuelpro-artifact-dist
          path: web/dist/
          retention-days: 14
