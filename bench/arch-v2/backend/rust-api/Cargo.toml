[package]
name = "rustapi"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.31"
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
